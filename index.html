<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>FL SERVIÇOS CRM</title>
    <meta
      name="description"
      content="Gestão de ordens de serviço, clientes e materiais da FL SERVIÇOS — Macaé/RJ"
    />
    <meta name="author" content="FL SERVIÇOS" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B3D91" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" deixa a barra de status com fundo próprio, empurrando o
         conteudo para baixo. "black-translucent" fazia o app comecar DEBAIXO
         da hora e da bateria, e o topo ficava sem toque. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FL SERVIÇOS" />

    <!-- O iPhone NAO aceita SVG como icone de atalho: so PNG.
         Icone 180x180 embutido em base64, tamanho que o iOS usa. -->
    <link rel="apple-touch-icon" sizes="180x180" href="ICONE_FL_180" />
    <link rel="apple-touch-icon" href="ICONE_FL_180" />
    <link rel="icon" type="image/png" sizes="180x180" href="ICONE_FL_180" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta property="og:title" content="FL SERVIÇOS — Ordens de Serviço" />
    <meta
      property="og:description"
      content="Gestão de ordens de serviço, clientes e materiais — Macaé/RJ"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
